apiVersion: v1
kind: Pod
metadata:
  name: random-number-pod
spec:
  containers:
    - name: alpine
      image: alpine
      command: ["/bin/sh", "-c"]
      args: ["shuf -i 0-100 -n 1 >> /opt/number.out && sleep 500"]
      volumeMounts:
        - name: data-storage
          mountPath: /opt
  volumes:
    - name: data-storage
      persistentVolumeClaim:
        claimName: my-first-pvc-madi
  restartPolicy: Never